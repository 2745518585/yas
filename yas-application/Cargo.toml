[package]
name = "yas-application"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
yas = { path = "../yas" , package = "yas_core" }
yas_genshin = { path = "../yas-genshin", package = "yas_scanner_genshin" }
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
url = "2"
tiny_http = "0.12"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[build-dependencies]
winres = "0.1"

# [profile.release]
# lto = true
# panic = "abort"
# strip = true

[[bin]]
name = "yas"
path = "src/bin/yas.rs"
# build = "build.rs"

[[bin]]
name = "yas_artifact"
path = "src/bin/yas_artifact.rs"
# build = "build.rs"
